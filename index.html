              : '<div class="round-row"><span class="rk">Rest</span>' +
                '<button type="button" class="step-btn" data-action="nudge-round" data-index="' + i + '" data-field="restMs" data-delta="-5000">−5s</button>' +
                '<button type="button" class="time-value" data-action="edit-round" data-index="' + i + '" data-field="restMs">' + formatMs(r.restMs) + "</button>" +
                '<button type="button" class="step-btn" data-action="nudge-round" data-index="' + i + '" data-field="restMs" data-delta="5000">+5s</button>' +
              "</div>") +
          "</div>";
      }
    }

    return (
      '<div class="edit-screen">' +
      '<div class="topbar">' +
        '<button type="button" class="icon-btn" data-action="cancel-edit" aria-label="Back">' + ic.back + "</button>" +
        "<h1>" + (state.draftIsNew ? "New Timer" : "Edit Timer") + "</h1>" +
        '<button type="button" class="text-btn" data-action="save-edit" style="color:#fff">Done</button>' +
      "</div>" +
      '<div class="scroll">' +
        '<div class="section"><div class="label">Title</div>' +
          '<input id="title-input" type="text" maxlength="48" value="' + escapeHtml(d.title) + '" placeholder="e.g. Jump Rope">' +
        "</div>" +
        '<div class="section"><div class="label">Rounds</div>' +
          stepper("rounds", String(d.rounds), -1, 1, "−", "+") +
        "</div>" +
        phaseRow("work", "Work") +
        phaseRow("rest", "Rest") +
        phaseRow("ready", "Get Ready") +
        '<div class="more-wrap">' +
          '<button type="button" class="more-toggle' + moreOpen + '" data-action="toggle-edit-more">More options ' + ic.chev + "</button>" +
          '<div class="more-body' + moreOpen + '">' +
            '<div class="section"><div class="label">Per-round times</div>' +
              '<button type="button" class="ghost-btn wide" data-action="toggle-rounds">' +
                (state.moreRounds || (d.roundOverrides && d.roundOverrides.length) ? "Hide rounds" : "Edit individual rounds") +
              "</button>" +
              roundsHtml +
            "</div>" +
            '<div class="edit-footer">' +
              '<button type="button" class="ghost-btn" data-action="export">Export</button>' +
              '<button type="button" class="ghost-btn" data-action="import">Import</button>' +
            "</div>" +
            (state.draftIsNew ? "" :
              '<div class="edit-footer">' +
                '<button type="button" class="ghost-btn" data-action="duplicate">Duplicate</button>' +
                '<button type="button" class="danger-btn" data-action="delete">Delete</button>' +
              "</div>") +
          "</div>" +
        "</div>" +
        '<input id="import-file" class="sr-only" type="file" accept="application/json,.json">' +
      "</div>" +
      "</div>"
    );
  }

  function currentRunStep() {
    const run = state.run;
    if (!run || run.done) return { phase: "done", round: run ? run.steps[run.steps.length - 1].round : 1, label: "COMPLETE", duration: 1 };
    return run.steps[run.index];
  }

  function totalRounds(run) {
    let max = 1;
    (run.steps || []).forEach(function (s) { if (s.round > max) max = s.round; });
    return max;
  }

  function renderRun() {
    const ic = icons();
    const run = state.run;
    const step = currentRunStep();
    const phase = run.done ? "done" : step.phase;
    const rem = run.done ? 0 : remainingMs();
    const dur = run.done ? 1 : step.duration;
    const progress = run.done ? 0 : Math.max(0, Math.min(1, rem / dur));
    const offset = RING_C * (1 - progress);
    const cfg = !run.done ? warnConfigFor(step.phase, run.sounds) : null;
    const at = cfg && cfg.enabled ? clampWarnAtSec(cfg.atSec, step.duration) : 0;
    const warn = !run.done && !run.paused && at >= 1 && rem > 0 && rem <= at * 1000;
    const paused = run.paused;
    const roundMax = totalRounds(run);
    const roundNow = step.round;
    const headline = displayLabel(run, phase, run.done);
    const roundText = run.done
      ? "ALL ROUNDS DONE"
      : (phase === "ready" ? "STARTING SOON" : ("ROUND " + roundNow + " / " + roundMax));

    return (
      '<div id="view-run" data-phase="' + phase + '">' +
        '<div class="topbar">' +
          "<div class=\"title-block\"></div>" +
          '<button type="button" class="icon-btn" data-action="stop" aria-label="Stop">' + ic.close + "</button>" +
        "</div>" +
        '<div class="run-stage">' +
          '<div class="run-headline" id="run-phase">' + escapeHtml(headline) + "</div>" +
          '<div class="ring-wrap">' +
            '<svg viewBox="0 0 200 200" aria-hidden="true">' +
              '<circle class="track" cx="100" cy="100" r="' + RING_R + '"></circle>' +
              '<circle class="prog" id="run-ring" cx="100" cy="100" r="' + RING_R + '" ' +
                'stroke-dasharray="' + RING_C.toFixed(2) + '" stroke-dashoffset="' + offset.toFixed(2) + '"></circle>' +
            "</svg>" +
            '<div class="ring-center">' +
              '<div class="big-time' + (warn ? " warn" : "") + '" id="run-time">' + (run.done ? "0:00" : formatMs(rem)) + "</div>" +
            "</div>" +
          "</div>" +
          '<div class="round-chip" id="run-round">' + escapeHtml(roundText) + "</div>" +
        "</div>" +
        '<div class="run-controls simple">' +
          (run.done
            ? '<button type="button" class="ctrl main" data-action="restart"><span class="hit">' + ic.play + "</span>Again</button>" +
              '<button type="button" class="ctrl" data-action="stop"><span class="hit">' + ic.close + "</span>Done</button>"
            : '<button type="button" class="ctrl main" data-action="' + (paused ? "resume" : "pause") + '">' +
                '<span class="hit">' + (paused ? ic.play : ic.pause) + "</span>" + (paused ? "Resume" : "Pause") +
              "</button>" +
              '<button type="button" class="ctrl" data-action="stop"><span class="hit">' + ic.close + "</span>Stop</button>") +
        "</div>" +
      "</div>"
    );
  }

  function renderRunChrome() {
    // Re-render the run view when phase/pause/done changes (not every tick).
    if (state.view !== "run") return;
    app.innerHTML = renderRun();
    fitPhaseLabel(document.getElementById("run-phase"));
  }

  function updateRunUI() {
    if (state.view !== "run" || !state.run) return;
    const run = state.run;
    const timeEl = document.getElementById("run-time");
    const ring = document.getElementById("run-ring");
    if (!timeEl) return;
    if (run.done) {
      timeEl.textContent = "0:00";
      timeEl.className = "big-time";
      if (ring) ring.setAttribute("stroke-dashoffset", String(RING_C));
      return;
    }
    const step = run.steps[run.index];
    const rem = remainingMs();
    const progress = Math.max(0, Math.min(1, rem / step.duration));
    timeEl.textContent = formatMs(rem);
    const cfg = warnConfigFor(step.phase, run.sounds);
    const at = cfg && cfg.enabled ? clampWarnAtSec(cfg.atSec, step.duration) : 0;
    const warn = !run.paused && at >= 1 && rem > 0 && rem <= at * 1000;
    timeEl.className = "big-time" + (warn ? " warn" : "");
    if (ring) ring.setAttribute("stroke-dashoffset", (RING_C * (1 - progress)).toFixed(2));
  }

  function render() {
    if (state.view === "edit") app.innerHTML = renderEditor();
    else if (state.view === "run") app.innerHTML = renderRun();
    else app.innerHTML = renderList();
    renderOverlay();
    if (state.view === "run") {
      fitPhaseLabel(document.getElementById("run-phase"));
      requestAnimationFrame(function () { fitPhaseLabel(document.getElementById("run-phase")); });
    }
  }

  // ---------- editor actions ----------
  function readTitle() {
    if (state.view !== "edit" || !state.draft) return;
    const input = document.getElementById("title-input");
    if (input) state.draft.title = input.value;
  }

  function nudgeField(field, delta) {
    readTitle();
    if (field === "rounds") {
      state.draft.rounds = Math.max(1, Math.min(99, state.draft.rounds + delta));
      state.draft.roundOverrides = (state.draft.roundOverrides || []).filter(function (o) {
        return o.index < state.draft.rounds;
      });
    } else if (field === "workMs") {
      state.draft.workMs = clampTime(state.draft.workMs + delta, 1000);
    } else if (field === "restMs") {
      state.draft.restMs = clampTime(state.draft.restMs + delta, 0);
    } else if (field === "warmupMs") {
      state.draft.warmupMs = clampTime((state.draft.warmupMs || 0) + delta, 0);
    }
    render();
    focusTitleCaret();
  }

  function focusTitleCaret() {
    const input = document.getElementById("title-input");
    if (input && document.activeElement === input) {
      // restored via render, so this won't happen; leave as-is
    }
  }

  function applyTimeToField(field, ms, roundIndex) {
    if (roundIndex != null) {
      const min = field === "workMs" ? 1000 : 0;
      const val = clampTime(ms, min);
      const list = (state.draft.roundOverrides || []).slice();
      let o = list.find(function (x) { return x.index === roundIndex; });
      if (!o) {
        o = { index: roundIndex };
        list.push(o);
      }
      o[field] = val;
      const rWork = o.workMs != null ? o.workMs : state.draft.workMs;
      const rRest = o.restMs != null ? o.restMs : state.draft.restMs;
      if (rWork === state.draft.workMs && rRest === state.draft.restMs) {
        state.draft.roundOverrides = list.filter(function (x) { return x.index !== roundIndex; });
      } else {
        state.draft.roundOverrides = list;
      }
    } else {
      if (field === "workMs") state.draft.workMs = clampTime(ms, 1000);
      else if (field === "restMs") state.draft.restMs = clampTime(ms, 0);
      else if (field === "warmupMs") state.draft.warmupMs = clampTime(ms, 0);
    }
  }

  function openTimeEditor(field, currentMs, roundIndex) {
    state.overlay = {
      type: "time",
      field: field,
      ms: currentMs,
      roundIndex: roundIndex
    };
    renderOverlay();
    setTimeout(function () {
      const el = document.getElementById("te-min");
      if (el) el.focus();
    }, 50);
  }

  let editBaseline = null;
  let editHistoryPushed = false;
  let ignoreEditPop = false;

  function draftFingerprint(preset) {
    const p = makePreset(JSON.parse(JSON.stringify(preset || {})));
    return JSON.stringify({
      title: (p.title || "").trim(),
      rounds: p.rounds,
      workMs: p.workMs,
      restMs: p.restMs,
      warmupMs: p.warmupMs,
      roundOverrides: p.roundOverrides || [],
      sounds: p.sounds,
      display: p.display
    });
  }

  function syncEditorFields() {
    readTitle();
    if (state.overlay && state.overlay.type === "phase" && state.draft) syncPhasePanel();
  }

  function isUntouchedNewDraft() {
    if (!state.draft || !state.draftIsNew) return false;
    syncEditorFields();
    return draftFingerprint(state.draft) === editBaseline;
  }

  function persistDraft() {
    if (state.view !== "edit" || !state.draft) return false;
    syncEditorFields();
    if (isUntouchedNewDraft()) return false;
    let title = (state.draft.title || "").trim();
    if (!title) title = "New Timer";
    state.draft.title = title;
    const input = document.getElementById("title-input");
    if (input && input.value.trim() === "") input.value = title;
    state.draft.updatedAt = Date.now();
    const saved = makePreset(state.draft);
    const existing = findPreset(state.draft.id);
    if (existing) {
      state.presets[state.presets.indexOf(existing)] = saved;
    } else {
      state.presets.unshift(saved);
    }
    saveStore();
    state.draftIsNew = false;
    editBaseline = draftFingerprint(state.draft);
    return true;
  }

  function dropEditHistory() {
    if (!editHistoryPushed) return;
    editHistoryPushed = false;
    ignoreEditPop = true;
    try { history.back(); } catch (e) { ignoreEditPop = false; }
    setTimeout(function () { ignoreEditPop = false; }, 400);
  }

  function leaveEditor() {
    if (state.overlay) {
      state.overlay = null;
      renderOverlay();
    }
    state.view = "list";
    state.draft = null;
    state.draftIsNew = false;
    state.moreEdit = false;
    state.moreRounds = false;
    editBaseline = null;
    render();
    dropEditHistory();
  }

  function exitEditor(opts) {
    opts = opts || {};
    if (state.view !== "edit") return;
    const saved = opts.persist === false ? false : persistDraft();
    if (opts.toast && saved) toast("Saved");
    const fromPop = !!opts.fromPopstate;
    if (fromPop) editHistoryPushed = false;
    leaveEditor();
    if (fromPop) editHistoryPushed = false;
  }

  function saveDraft() {
    exitEditor({ persist: true, toast: true });
  }

  function cancelEdit() {
    exitEditor({ persist: true, toast: false });
  }

  function openEditor(preset, isNew) {
    state.draft = makePreset(JSON.parse(JSON.stringify(preset)));
    state.draftIsNew = !!isNew;
    state.moreEdit = false;
    state.moreRounds = !!(preset.roundOverrides && preset.roundOverrides.length);
    state.view = "edit";
    editBaseline = draftFingerprint(state.draft);
    render();
    const input = document.getElementById("title-input");
    if (input && isNew) {
      input.focus();
      input.select();
    }
    if (!editHistoryPushed) {
      try {
        history.pushState({ rtView: "edit", id: state.draft.id }, "");
        editHistoryPushed = true;
      } catch (e) {}
    }
  }

  function confirmDialog(opts, onOk) {
    state.overlay = {
      type: "confirm",
      title: opts.title,
      body: opts.body,
      okLabel: opts.okLabel,
      danger: !!opts.danger,
      onOk: onOk
    };
    renderOverlay();
  }

  // ---------- import / export ----------
  function exportPresets() {
    const payload = {
      version: 1,
      exportedAt: new Date().toISOString(),
      presets: state.presets
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "round-timers.json";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 500);
    toast("Exported");
  }

  function importPresets(file) {
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const data = JSON.parse(String(reader.result));
        const list = Array.isArray(data) ? data : data.presets;
        if (!Array.isArray(list) || !list.length) {
          toast("No timers in that file.");
          return;
        }
        let added = 0;
        list.forEach(function (p) {
          const copy = makePreset(p);
          copy.id = uid();
          copy.updatedAt = Date.now();
          state.presets.push(copy);
          added++;
        });
        saveStore();
        render();
        toast("Imported " + added + (added === 1 ? " timer" : " timers"));
      } catch (e) {
        toast("Couldn’t read that file.");
      }
    };
    reader.readAsText(file);
  }

  // ---------- events ----------
  function onClick(e) {
    const t = e.target.closest("[data-action]");
    if (!t) return;
    const action = t.getAttribute("data-action");
    if (action !== "overlay-backdrop" && action !== "prompt-backdrop") tapHaptic();

    if (action === "new") {
      unlockAudio();
      openEditor(makePreset({ title: "", rounds: 8, workMs: 60000, restMs: 30000 }), true);
      return;
    }
    if (action === "start") {
      e.stopPropagation();
      const p = findPreset(t.getAttribute("data-id"));
      if (p) startRun(p);
      return;
    }
    if (action === "edit") {
      const p = findPreset(t.getAttribute("data-id"));
      if (p) openEditor(p, false);
      return;
    }
    if (action === "cancel-edit") { cancelEdit(); return; }
    if (action === "save-edit") { saveDraft(); return; }
    if (action === "toggle-list-more") {
      state.moreList = !state.moreList;
      render();
      return;
    }
    if (action === "toggle-haptics") {
      state.haptics = state.haptics === false;
      saveStore();
      t.classList.toggle("on", state.haptics !== false);
      t.setAttribute("aria-checked", state.haptics !== false ? "true" : "false");
      return;
    }
    if (action === "toggle-edit-more") {
      readTitle();
      state.moreEdit = !state.moreEdit;
      render();
      return;
    }
    if (action === "toggle-rounds") {
      readTitle();
      state.moreRounds = !state.moreRounds;
      if (state.moreRounds) state.moreEdit = true;
      render();
      return;
    }
    if (action === "nudge") {
      nudgeField(t.getAttribute("data-field"), Number(t.getAttribute("data-delta")));
      return;
    }
    if (action === "edit-value") {
      readTitle();
      const field = t.getAttribute("data-field");
      if (field === "rounds") return;
      openTimeEditor(field, state.draft[field] || 0, null);
      return;
    }
    if (action === "nudge-round") {
      readTitle();
      const idx = Number(t.getAttribute("data-index"));
      const field = t.getAttribute("data-field");
      const delta = Number(t.getAttribute("data-delta"));
      const cur = getRoundTimes(state.draft, idx);
      applyTimeToField(field, cur[field] + delta, idx);
      render();
      return;
    }
    if (action === "edit-round") {
      readTitle();
      const idx = Number(t.getAttribute("data-index"));
      const field = t.getAttribute("data-field");
      const cur = getRoundTimes(state.draft, idx);
      openTimeEditor(field, cur[field], idx);
      return;
    }
    if (action === "reset-round") {
      readTitle();
      clearOverride(state.draft, Number(t.getAttribute("data-index")));
      render();
      return;
    }
    if (action === "open-phase") {
      readTitle();
      unlockAudio();
      if (!state.draft.display) state.draft.display = normalizeDisplay(null);
      state.overlay = { type: "phase", phase: t.getAttribute("data-phase") };
      renderOverlay();
      return;
    }
    if (action === "phase-done") {
      closeOverlay();
      return;
    }
    if (action === "phase-nudge") {
      if (!state.overlay || state.overlay.type !== "phase" || !state.draft) return;
      syncPhasePanel();
      const field = phaseField(state.overlay.phase);
      const delta = Number(t.getAttribute("data-delta"));
      const minMs = field === "workMs" ? 1000 : 0;
      state.draft[field] = clampTime((state.draft[field] || 0) + delta, minMs);
      const ms = state.draft[field] || 0;
      const total = Math.max(0, Math.round(ms / 1000));
      const timeEl = document.getElementById("phase-time");
      const minEl = document.getElementById("phase-min");
      const secEl = document.getElementById("phase-sec");
      if (timeEl) timeEl.textContent = formatMs(ms);
      if (minEl) minEl.value = String(Math.floor(total / 60));
      if (secEl) secEl.value = String(total % 60);
      return;
    }
    if (action === "phase-pick-sound") {
      if (!state.overlay || state.overlay.type !== "phase" || !state.draft) return;
      const key = t.getAttribute("data-event");
      const id = t.getAttribute("data-id");
      const ev = SOUND_EVENTS.find(function (x) { return x.key === key; });
      if (ev && ev.kind === "warn") state.draft.sounds[key].sound = id;
      else state.draft.sounds[key] = id;
      playSound(id);
      refreshSoundPicks();
      return;
    }
    if (action === "upload-sound") {
      state.uploadEvent = t.getAttribute("data-event");
      const input = document.getElementById("sound-upload");
      if (input) {
        input.value = "";
        input.click();
      }
      return;
    }
    if (action === "rename-sound") {
      const id = t.getAttribute("data-id");
      const rec = (state.customSounds || []).find(function (s) { return s.id === id; });
      if (!rec) return;
      showPrompt({
        title: "Rename sound",
        input: true,
        value: rec.name,
        okLabel: "Save",
        onOk: function (value) { renameCustomSound(id, value); }
      });
      return;
    }
    if (action === "delete-sound") {
      const id = t.getAttribute("data-id");
      const rec = (state.customSounds || []).find(function (s) { return s.id === id; });
      if (!rec) return;
      showPrompt({
        title: "Delete this sound?",
        body: "Timers that use it will go back to the built-in default.",
        danger: true,
        okLabel: "Delete",
        onOk: function () { removeCustomSound(id); }
      });
      return;
    }
    if (action === "prompt-backdrop") {
      if (e.target !== t) return;
      closePrompt();
      return;
    }
    if (action === "prompt-cancel") { closePrompt(); return; }
    if (action === "prompt-ok") { finishPrompt(true); return; }
    if (action === "phase-toggle-warn") {
      if (!state.overlay || state.overlay.type !== "phase" || !state.draft) return;
      const key = t.getAttribute("data-warn");
      if (!state.draft.sounds[key]) return;
      state.draft.sounds[key].enabled = !state.draft.sounds[key].enabled;
      const on = state.draft.sounds[key].enabled;
      t.classList.toggle("on", on);
      t.setAttribute("aria-checked", on ? "true" : "false");
      const body = document.getElementById("phase-warn-body");
      if (body) body.classList.toggle("hidden", !on);
      return;
    }
    if (action === "phase-warn-chip") {
      if (!state.overlay || state.overlay.type !== "phase" || !state.draft) return;
      const key = phaseWarnKey(state.overlay.phase);
      const n = Number(t.getAttribute("data-sec"));
      state.draft.sounds[key].atSec = n;
      const row = t.closest(".chip-row");
      if (row) {
        row.querySelectorAll(".chip").forEach(function (chip) {
          chip.classList.toggle("on", Number(chip.getAttribute("data-sec")) === n);
        });
      }
      const input = document.getElementById("warn-custom-sec");
      if (input) input.value = String(n);
      return;
    }
    if (action === "phase-warn-custom") {
      if (!state.overlay || state.overlay.type !== "phase" || !state.draft) return;
      const input = document.getElementById("warn-custom-sec");
      const n = Math.max(1, Math.min(599, Math.round(Number(input && input.value) || 1)));
      const key = phaseWarnKey(state.overlay.phase);
      state.draft.sounds[key].atSec = n;
      if (input) input.value = String(n);
      const row = document.querySelector(".phase-sheet .chip-row");
      if (row) {
        row.querySelectorAll(".chip").forEach(function (chip) {
          chip.classList.toggle("on", Number(chip.getAttribute("data-sec")) === n);
        });
      }
      return;
    }
    if (action === "phase-warn-mode") {
      if (!state.overlay || state.overlay.type !== "phase" || !state.draft) return;
      const mode = t.getAttribute("data-mode") === "ticks" ? "ticks" : "once";
      const key = phaseWarnKey(state.overlay.phase);
      state.draft.sounds[key].mode = mode;
      const row = t.closest(".mode-row");
      if (row) {
        row.querySelectorAll(".chip").forEach(function (chip) {
          chip.classList.toggle("on", chip.getAttribute("data-mode") === mode);
        });
      }
      return;
    }
    if (action === "phase-work-show") {
      if (!state.overlay || state.overlay.type !== "phase" || !state.draft) return;
      syncPhasePanel();
      const mode = t.getAttribute("data-mode");
      state.draft.display.workUseTitle = mode === "title";
      const sheet = document.querySelector(".phase-sheet .sheet-scroll");
      const top = sheet ? sheet.scrollTop : 0;
      renderOverlay();
      const sheet2 = document.querySelector(".phase-sheet .sheet-scroll");
      if (sheet2) sheet2.scrollTop = top;
      return;
    }
    if (action === "preview-sound") {
      playSound(t.getAttribute("data-sound"));
      return;
    }
    if (action === "choose-sound") {
      readTitle();
      const key = t.getAttribute("data-event");
      const ev = SOUND_EVENTS.find(function (x) { return x.key === key; });
      const current = ev && ev.kind === "warn" ? state.draft.sounds[key].sound : state.draft.sounds[key];
      state.overlay = {
        type: "sound",
        event: key,
        kind: ev ? ev.kind : "cue",
        label: ev ? ev.label : "Sound",
        current: current
      };
      renderOverlay();
      return;
    }
    if (action === "pick-sound") {
      const id = t.getAttribute("data-id");
      if (state.overlay && state.overlay.type === "sound" && state.draft) {
        const key = state.overlay.event;
        const ev = SOUND_EVENTS.find(function (x) { return x.key === key; });
        if (ev && ev.kind === "warn") state.draft.sounds[key].sound = id;
        else state.draft.sounds[key] = id;
        playSound(id);
      }
      closeOverlay();
      render();
      return;
    }
    if (action === "toggle-warn") {
      readTitle();
      const key = t.getAttribute("data-warn");
      if (state.draft && state.draft.sounds[key]) {
        state.draft.sounds[key].enabled = !state.draft.sounds[key].enabled;
      }
      render();
      return;
    }
    if (action === "edit-warn") {
      readTitle();
      const key = t.getAttribute("data-warn");
      const ev = SOUND_EVENTS.find(function (x) { return x.key === key; });
      state.overlay = { type: "warn", key: key, label: ev ? ev.label : "Warning" };
      renderOverlay();
      return;
    }
    if (action === "warn-chip") {
      if (state.overlay && state.overlay.type === "warn" && state.draft) {
        state.draft.sounds[state.overlay.key].atSec = Number(t.getAttribute("data-sec"));
        render();
        state.overlay = { type: "warn", key: state.overlay.key, label: state.overlay.label };
        renderOverlay();
      }
      return;
    }
    if (action === "warn-custom-apply") {
      const input = document.getElementById("warn-custom-sec");
      const n = Math.max(1, Math.min(599, Math.round(Number(input && input.value) || 1)));
      if (state.overlay && state.overlay.type === "warn" && state.draft) {
        state.draft.sounds[state.overlay.key].atSec = n;
        const keep = { type: "warn", key: state.overlay.key, label: state.overlay.label };
        render();
        state.overlay = keep;
        renderOverlay();
      }
      return;
    }
    if (action === "warn-mode") {
      if (state.overlay && state.overlay.type === "warn" && state.draft) {
        state.draft.sounds[state.overlay.key].mode = t.getAttribute("data-mode") === "ticks" ? "ticks" : "once";
        const keep = { type: "warn", key: state.overlay.key, label: state.overlay.label };
        render();
        state.overlay = keep;
        renderOverlay();
      }
      return;
    }
    if (action === "duplicate") {
      persistDraft();
      const src = state.draft || {};
      const copy = makePreset(JSON.parse(JSON.stringify(src)));
      copy.id = uid();
      copy.title = (src.title || "Timer") + " copy";
      copy.updatedAt = Date.now();
      state.presets.unshift(copy);
      saveStore();
      leaveEditor();
      toast("Duplicated");
      return;
    }
    if (action === "delete") {
      confirmDialog({
        title: "Delete this timer?",
        body: "This can’t be undone.",
        okLabel: "Delete",
        danger: true
      }, function () {
        if (state.draft) {
          state.presets = state.presets.filter(function (p) { return p.id !== state.draft.id; });
          saveStore();
        }
        exitEditor({ persist: false, toast: false });
        toast("Deleted");
      });
      return;
    }
    if (action === "export") { exportPresets(); return; }
    if (action === "import") {
      const input = document.getElementById("import-file");
      if (input) input.click();
      return;
    }
    if (action === "pause") { pauseRun(); return; }
    if (action === "resume") { resumeRun(); return; }
    if (action === "stop") {
      if (state.run && !state.run.done && !state.run.paused) pauseRun();
      if (state.run && !state.run.done) {
        confirmDialog({
          title: "Stop timer?",
          body: "You’ll go back to your list.",
          okLabel: "Stop",
          danger: true
        }, function () { stopRun(); });
      } else {
        stopRun();
      }
      return;
    }
    if (action === "restart") { restartRun(); return; }
    if (action === "overlay-backdrop") {
      if (e.target !== t) return;
      closeOverlay();
      return;
    }
    if (action === "overlay-cancel") {
      closeOverlay();
      return;
    }
    if (action === "overlay-ok") {
      const fn = state.overlay && state.overlay.onOk;
      closeOverlay();
      if (fn) fn();
      return;
    }
    if (action === "time-apply") {
      const minEl = document.getElementById("te-min");
      const secEl = document.getElementById("te-sec");
      const m = Math.max(0, Math.min(99, parseInt(minEl && minEl.value, 10) || 0));
      const s = Math.max(0, Math.min(59, parseInt(secEl && secEl.value, 10) || 0));
      const o = state.overlay;
      closeOverlay();
      if (o && o.type === "time") {
        applyTimeToField(o.field, (m * 60 + s) * 1000, o.roundIndex);
        render();
      }
      return;
    }
  }

  function onChange(e) {
    if (e.target && e.target.id === "import-file" && e.target.files && e.target.files[0]) {
      importPresets(e.target.files[0]);
      e.target.value = "";
    }
    if (e.target && e.target.id === "sound-upload" && e.target.files && e.target.files[0]) {
      handleSoundUpload(e.target.files[0]);
      e.target.value = "";
    }
  }

  document.addEventListener("input", function (e) {
    if (!e.target) return;
    if (e.target.id === "title-input" && state.draft) {
      state.draft.title = e.target.value;
    }
    if (state.overlay && state.overlay.type === "phase" && state.draft) {
      if (e.target.id === "phase-display-work" || e.target.id === "phase-display-rest" || e.target.id === "phase-display-ready" || e.target.id === "phase-min" || e.target.id === "phase-sec" || e.target.id === "warn-custom-sec") {
        syncPhasePanel();
        if (e.target.id === "phase-min" || e.target.id === "phase-sec") {
          const field = phaseField(state.overlay.phase);
          const tv = document.getElementById("phase-time");
          if (tv) tv.textContent = formatMs(state.draft[field] || 0);
        }
      }
    }
  });
  document.addEventListener("click", onClick);
  document.addEventListener("change", onChange);
  document.addEventListener("pointerdown", function () { unlockAudio(); }, { once: false, passive: true });

  function persistDraftIfHidden() {
    if (state.view === "edit" && state.draft) persistDraft();
  }

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") persistDraftIfHidden();
    if (document.visibilityState === "visible") {
      if (state.run && !state.run.paused && !state.run.done) {
        requestWake();
        catchUp();
      }
    }
  });
  window.addEventListener("pagehide", persistDraftIfHidden);

  window.addEventListener("popstate", function () {
    if (ignoreEditPop) {
      ignoreEditPop = false;
      return;
    }
    if (state.view === "edit") exitEditor({ persist: true, toast: false, fromPopstate: true });
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && state.prompt) {
      closePrompt();
      return;
    }
    if (e.key === "Escape" && state.overlay) {
      closeOverlay();
    }
  });

  function bindEditSwipe() {
    let drag = null;

    function onDown(e) {
      if (state.view !== "edit") return;
      if (state.overlay || state.prompt) return;
      if (e.pointerType === "mouse" && e.button !== 0) return;
      if (e.target && e.target.closest && e.target.closest("input, textarea, select, [switch]")) return;
      const screen = app.querySelector(".edit-screen");
      if (!screen) return;
      const edge = 32 + (parseInt(getComputedStyle(document.documentElement).getPropertyValue("--safe-left")) || 0);
      drag = {
        id: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        lastX: e.clientX,
        lastT: Date.now(),
        vx: 0,
        x: 0,
        dragging: false,
        fromEdge: e.clientX <= edge,
        screen: screen
      };
    }

    function onMove(e) {
      if (!drag || e.pointerId !== drag.id) return;
      if (state.view !== "edit" || state.overlay || state.prompt) { drag = null; return; }
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      const now = Date.now();
      const dt = Math.max(1, now - drag.lastT);
      drag.vx = (e.clientX - drag.lastX) / dt;
      drag.lastX = e.clientX;
      drag.lastT = now;

      if (!drag.dragging) {
        if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) {
          drag = null;
          return;
        }
        const ready = drag.fromEdge ? dx > 8 : (dx > 18 && dx > Math.abs(dy) * 1.25);
        if (!ready) return;
        drag.dragging = true;
        drag.screen.classList.add("dragging");
        drag.screen.style.transition = "none";
        try { drag.screen.setPointerCapture(e.pointerId); } catch (err) {}
      }

      if (e.cancelable) e.preventDefault();
      const x = Math.max(0, dx);
      drag.x = x;
      drag.screen.style.transform = "translateX(" + x + "px)";
      drag.screen.style.opacity = String(Math.max(0.45, 1 - x / (window.innerWidth || 390) * 0.35));
    }

    function finish(e) {
      if (!drag || (e && e.pointerId !== drag.id)) return;
      const d = drag;
      drag = null;
      const screen = d.screen;
      screen.classList.remove("dragging");
      if (!d.dragging) return;
      if (d.x > 6) {
        const swallow = function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
          screen.removeEventListener("click", swallow, true);
        };
        screen.addEventListener("click", swallow, true);
        setTimeout(function () { screen.removeEventListener("click", swallow, true); }, 400);
      }
      const wide = window.innerWidth || 390;
      const close = d.x > 110 || d.x > wide * 0.28 || (d.vx > 0.65 && d.x > 28);
      if (close) {
        screen.classList.add("exiting");
        screen.style.transition = "transform 0.2s ease, opacity 0.2s ease";
        screen.style.transform = "translateX(100%)";
        screen.style.opacity = "0.4";
        setTimeout(function () {
          if (state.view === "edit") exitEditor({ persist: true, toast: false });
        }, 200);
      } else {
        screen.style.transition = "transform 0.25s ease, opacity 0.25s ease";
        screen.style.transform = "translateX(0)";
        screen.style.opacity = "1";
      }
    }

    app.addEventListener("pointerdown", onDown);
    app.addEventListener("pointermove", onMove, { passive: false });
    app.addEventListener("pointerup", finish);
    app.addEventListener("pointercancel", finish);
  }

  bindEditSwipe();

  // Expose a tiny test hook so Playwright can drive a short preset without waiting minutes.
  window.__roundTimer = {
    getState: function () { return state; },
    formatMs: formatMs,
    startRun: startRun,
    saveStore: saveStore,
    makePreset: makePreset,
    normalizeSounds: normalizeSounds,
    normalizeDisplay: normalizeDisplay,
    displayLabel: displayLabel,
    clampWarnAtSec: clampWarnAtSec,
    events: function () { return state.events || []; },
    clearEvents: function () { state.events = []; },
    setRemainingMs: function (ms) {
      const run = state.run;
      if (!run || run.done) return;
      const step = run.steps[run.index];
      if (!step) return;
      const rem = Math.max(0, Math.min(step.duration, ms));
      if (run.paused) run.pauseRemaining = rem;
      else run.phaseStart = Date.now() - (step.duration - rem);
    },
    tick: function () { if (typeof catchUp === "function") catchUp(); },
    haptic: tapHaptic,
    listCustomSounds: function () { return (state.customSounds || []).slice(); },
    customSoundsReady: function () { return customSoundsReady; }
  };

  render();
  customSoundsReady.then(function () { render(); }).catch(function () {});
})();

  </script>
</body>
</html>
