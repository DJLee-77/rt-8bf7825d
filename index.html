<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#070708">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Round Timer">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Simple interval and boxing round timer">
  <title>Round Timer</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <style>
/* Round Timer — self-contained, no external fonts or CDNs */
:root {
  --bg: #070708;
  --bg-elev: #101012;
  --bg-card: #16161a;
  --bg-card-2: #1c1c21;
  --bg-hover: #222228;
  --line: rgba(255, 255, 255, 0.09);
  --line-strong: rgba(255, 255, 255, 0.16);
  --text: #f5f5f7;
  --muted: #8e8e93;
  --faint: #636366;
  --red: #ff3b30;
  --red-soft: rgba(255, 59, 48, 0.16);
  --blue: #64d2ff;
  --blue-soft: rgba(100, 210, 255, 0.16);
  --amber: #ffd60a;
  --amber-soft: rgba(255, 214, 10, 0.14);
  --green: #30d158;
  --green-soft: rgba(48, 209, 88, 0.16);
  --btn: #2c2c31;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
  --phase: var(--red);
  --radius: 18px;
  --tap: 48px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  min-height: 100%;
  min-height: 100dvh;
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button {
  appearance: none;
  -webkit-appearance: none;
  border: 0;
  background: none;
  padding: 0;
  margin: 0;
  cursor: pointer;
  touch-action: manipulation;
}
input {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 16px; /* prevent iOS zoom */
  width: 100%;
  outline: none;
  color: var(--text);
}
input:focus { border-color: var(--line-strong); }

#app {
  height: 100dvh;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  background: var(--bg);
}
.edit-screen {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
  will-change: transform;
}
.edit-screen.dragging { transition: none !important; }
.edit-screen.exiting { transition: transform 0.22s ease, opacity 0.22s ease; }

/* iOS 18+ switch used only to fire a system haptic; keep it real-sized but off-screen */
.haptic-input, .haptic-label {
  position: fixed;
  left: -80px;
  bottom: 8px;
  width: 52px;
  height: 32px;
  margin: 0;
  opacity: 0.02;
  pointer-events: none;
  z-index: 0;
}
#prompt-root .overlay { z-index: 60; }

/* ===== Shared chrome ===== */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: calc(10px + var(--safe-top)) 16px 12px;
  flex-shrink: 0;
  position: relative;
  z-index: 2;
}
.topbar h1 {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text);
}
.topbar .title-block { min-width: 0; flex: 1; }
.topbar .title-block .sub {
  margin: 2px 0 0;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0;
  text-transform: none;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.icon-btn {
  width: var(--tap);
  height: var(--tap);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--bg-card);
  border: 1px solid var(--line);
  color: var(--text);
  flex-shrink: 0;
}
.icon-btn:active { transform: scale(0.96); background: var(--bg-hover); }
.icon-btn.primary {
  background: var(--green);
  border-color: transparent;
  color: #0a0a0c;
}
.icon-btn.primary:active { filter: brightness(0.92); }
.icon-btn svg { width: 22px; height: 22px; display: block; }
.topbar-actions { display: flex; gap: 8px; }

.scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 4px 16px calc(24px + var(--safe-bot));
}

/* ===== List ===== */
.preset-list { display: flex; flex-direction: column; gap: 12px; }
.preset-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 16px 14px;
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-rows: auto auto auto;
  gap: 0 12px;
  text-align: left;
  width: 100%;
  box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset;
}
.preset-card:active { background: var(--bg-card-2); }
.preset-card .name {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.03em;
  grid-column: 1;
  grid-row: 1;
  line-height: 1.15;
}
.preset-card .meta {
  grid-column: 1;
  grid-row: 2;
  color: var(--muted);
  font-size: 14px;
  margin-top: 6px;
  line-height: 1.4;
}
.preset-card .meta strong { color: var(--text); font-weight: 600; }
.preset-card .total {
  grid-column: 1;
  grid-row: 3;
  margin-top: 10px;
  font-size: 12px;
  color: var(--faint);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.play-btn {
  grid-column: 2;
  grid-row: 1 / span 3;
  align-self: center;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--red);
  color: #fff;
  display: grid;
  place-items: center;
}
.play-btn:active { transform: scale(0.95); filter: brightness(0.92); }
.play-btn svg { width: 24px; height: 24px; margin-left: 2px; }
.card-actions {
  display: flex;
  gap: 6px;
  margin-top: 2px;
}

.empty {
  text-align: center;
  padding: 64px 24px;
  color: var(--muted);
}
.empty h2 { color: var(--text); margin: 0 0 8px; font-size: 22px; letter-spacing: -0.02em; }
.empty p { margin: 0 0 24px; line-height: 1.45; }

.footer-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 18px;
  padding-bottom: 8px;
}
.ghost-btn, .text-btn, .solid-btn, .danger-btn {
  min-height: var(--tap);
  padding: 0 16px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.ghost-btn {
  background: var(--bg-card);
  border: 1px solid var(--line);
  color: var(--text);
  flex: 1;
}
.ghost-btn:active, .solid-btn:active, .danger-btn:active { transform: scale(0.98); }
.solid-btn { background: var(--green); color: #0a0a0c; min-width: 88px; }
.text-btn { color: var(--muted); font-weight: 600; font-size: 15px; padding: 0 10px; min-height: var(--tap); }
.text-btn:active { color: var(--text); }
.danger-btn { background: var(--red-soft); color: #ff6b63; }
.wide { width: 100%; }

/* ===== Editor ===== */
.section {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.section h2, .label {
  margin: 0 0 10px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.hint { margin: 8px 0 0; font-size: 13px; color: var(--faint); line-height: 1.4; }

.stepper {
  display: flex;
  align-items: center;
  gap: 6px;
}
.step-btn {
  min-width: 52px;
  height: 48px;
  padding: 0 8px;
  border-radius: 12px;
  background: var(--btn);
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
  flex-shrink: 0;
}
.step-btn:active { background: var(--bg-hover); }
.step-value, .time-value {
  flex: 1;
  text-align: center;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.03em;
  min-height: 48px;
  display: grid;
  place-items: center;
  color: var(--text);
  border-radius: 12px;
}
.time-value { cursor: pointer; }
.time-value:active { background: var(--bg-hover); }

.round-card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 12px 10px;
  margin-top: 10px;
}
.round-card header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.round-card header .rn {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.round-card.custom header .rn { color: var(--amber); }
.round-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}
.round-row .rk {
  width: 44px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  flex-shrink: 0;
}
.round-row .step-btn { min-width: 46px; height: 42px; }
.round-row .time-value { font-size: 20px; min-height: 42px; }
.reset-link { color: var(--blue); font-size: 13px; font-weight: 600; padding: 6px 8px; min-height: 36px; }

.sound-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
}
.sound-row:first-of-type { border-top: 0; padding-top: 0; }
.sound-row .info { flex: 1; min-width: 0; }
.sound-row .info .k { font-size: 15px; font-weight: 600; }
.sound-row .info .v { font-size: 13px; color: var(--muted); margin-top: 2px; }
.mini-btn {
  height: 44px;
  min-width: 44px;
  padding: 0 12px;
  border-radius: 12px;
  background: var(--btn);
  font-weight: 600;
  font-size: 13px;
  color: var(--text);
}
.mini-btn:active { background: var(--bg-hover); }
.mini-btn.play { width: 44px; padding: 0; display: grid; place-items: center; }

.switch {
  width: 46px;
  height: 28px;
  border-radius: 14px;
  background: #3a3a3e;
  position: relative;
  flex-shrink: 0;
  padding: 0;
  min-height: 28px;
}
.switch i {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #fff;
  pointer-events: none;
  transition: transform 0.15s ease;
}
.switch.on { background: var(--green); }
.switch.on i { transform: translateX(18px); }
.sound-row.off .info,
.sound-row.off .mini-btn { opacity: 0.42; }
.warn-meta {
  display: block;
  width: 100%;
  text-align: left;
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  margin-top: 2px;
  padding: 2px 0;
  min-height: 28px;
  line-height: 1.35;
}
.warn-meta:active { color: var(--text); }
.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 4px 0 14px;
}
.chip {
  min-height: 44px;
  padding: 0 14px;
  border-radius: 12px;
  background: var(--btn);
  font-weight: 700;
  font-size: 15px;
}
.chip.on { background: var(--green); color: #0a0a0c; }
.mode-row { display: flex; gap: 8px; margin: 4px 0 16px; }
.mode-row .chip { flex: 1; }
.warn-custom {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}
.warn-custom input {
  width: 88px;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  padding: 10px 8px;
}
.warn-custom span { color: var(--muted); font-size: 14px; font-weight: 600; }

.edit-footer {
  display: flex;
  gap: 8px;
  margin-top: 4px;
  margin-bottom: 12px;
}

/* ===== Run ===== */
#view-run {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  background: var(--bg);
}
#view-run::before {
  content: "";
  position: absolute;
  inset: -20% -10% auto -10%;
  height: 70%;
  background: radial-gradient(ellipse at 50% 0%, var(--glow, rgba(255,59,48,0.22)), transparent 65%);
  pointer-events: none;
  transition: background 0.4s ease;
}
#view-run[data-phase="work"] { --phase: var(--green); --glow: rgba(48,209,88,0.28); }
#view-run[data-phase="rest"] { --phase: var(--red); --glow: rgba(255,59,48,0.28); }
#view-run[data-phase="ready"] { --phase: var(--amber); --glow: rgba(255,214,10,0.22); }
#view-run[data-phase="done"] { --phase: var(--green); --glow: rgba(48,209,88,0.22); }

.run-stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 1;
  padding: 0 16px 8px;
  gap: 8px;
}
.run-headline {
  font-weight: 800;
  font-size: 52px;
  line-height: 1.08;
  letter-spacing: -0.035em;
  text-align: center;
  color: var(--phase);
  max-width: 100%;
  width: 100%;
  padding: 2px 10px 10px;
  margin: 0;
  overflow: hidden;
  word-break: break-word;
  transition: color 0.3s ease;
}
.round-chip {
  font-size: clamp(32px, 11vw, 54px);
  font-weight: 800;
  letter-spacing: -0.03em;
  text-transform: uppercase;
  color: var(--text);
  margin-top: 14px;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
  text-align: center;
}
.ring-wrap {
  position: relative;
  width: min(68vw, 300px);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
}
.ring-wrap svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}
.ring-wrap .track { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 7; }
.ring-wrap .prog {
  fill: none;
  stroke: var(--phase);
  stroke-width: 7;
  stroke-linecap: round;
  transition: stroke 0.3s ease;
  filter: drop-shadow(0 0 8px color-mix(in srgb, var(--phase) 70%, transparent));
}
.ring-center {
  position: relative;
  z-index: 1;
  text-align: center;
  padding-top: 6px;
}
.phase-label { display: none; }
.big-time {
  font-size: clamp(64px, 22vw, 108px);
  font-weight: 700;
  letter-spacing: -0.05em;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
  line-height: 1;
  color: var(--text);
}
.big-time.warn { color: var(--amber); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.72; }
}
.done-msg { margin-top: 8px; color: var(--muted); font-size: 15px; }

.run-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 8px 16px calc(22px + var(--safe-bot));
  position: relative;
  z-index: 1;
}
.ctrl {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  min-width: 72px;
}
.ctrl .hit {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  color: var(--text);
}
.ctrl .hit:active { transform: scale(0.95); background: var(--bg-hover); }
.ctrl.main .hit {
  width: 78px;
  height: 78px;
  background: var(--phase);
  border-color: transparent;
  color: #0a0a0c;
}
#view-run[data-phase="rest"] .ctrl.main .hit { color: #fff; }
.ctrl svg { width: 26px; height: 26px; display: block; }
.ctrl.main svg { width: 32px; height: 32px; }

/* ===== Sheets / modals ===== */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  z-index: 40;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.overlay.center { align-items: center; padding: 24px; }
.sheet {
  width: 100%;
  max-width: 520px;
  background: #1c1c21;
  border-radius: 22px 22px 0 0;
  padding: 10px 16px calc(18px + var(--safe-bot));
  box-shadow: var(--shadow);
  animation: up 0.22s ease;
}
@keyframes up {
  from { transform: translateY(16px); opacity: 0.6; }
  to { transform: none; opacity: 1; }
}
.sheet .grab {
  width: 100%;
  height: auto;
  min-height: 24px;
  background: transparent;
  margin: 0 auto 4px;
  padding: 10px 0 12px;
  position: relative;
  touch-action: none;
  cursor: grab;
}
.sheet .grab::before {
  content: "";
  display: block;
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: rgba(255,255,255,0.18);
  margin: 0 auto;
}
.sheet h3 { margin: 0 16px 12px; font-size: 18px; letter-spacing: -0.02em; }
.sheet-item, .sheet-btn {
  width: 100%;
  text-align: left;
  min-height: 52px;
  padding: 10px 16px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 16px;
  font-weight: 600;
}
.sheet-item:active, .sheet-btn:active { background: var(--bg-hover); }
.sheet-item .left { display: flex; flex-direction: column; gap: 2px; }
.sheet-item .sub { font-size: 13px; color: var(--muted); font-weight: 500; }
.sheet-item .tick { color: var(--green); font-size: 18px; }
.sheet-item.danger, .sheet-btn.danger { color: #ff6b63; }
.sheet-cancel {
  width: 100%;
  min-height: 52px;
  margin-top: 8px;
  border-radius: 14px;
  background: var(--btn);
  font-weight: 700;
  font-size: 16px;
}

.dialog {
  width: 100%;
  max-width: 340px;
  background: #1c1c21;
  border-radius: 20px;
  padding: 22px 20px 16px;
  box-shadow: var(--shadow);
}
.dialog h3 { margin: 0 0 8px; font-size: 18px; }
.dialog p { margin: 0 0 18px; color: var(--muted); font-size: 15px; line-height: 1.4; }
.dialog .row { display: flex; gap: 8px; }
.dialog .row button { flex: 1; }

.time-edit .fields {
  display: flex;
  gap: 10px;
  margin: 8px 0 16px;
}
.time-edit .field { flex: 1; text-align: center; }
.time-edit .field span {
  display: block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--muted);
  margin-bottom: 6px;
}
.time-edit input { text-align: center; font-size: 28px; font-weight: 700; padding: 12px 8px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + var(--safe-bot));
  transform: translateX(-50%);
  background: #2a2a30;
  color: var(--text);
  padding: 12px 18px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  z-index: 40;
  box-shadow: var(--shadow);
  animation: fade 2.2s ease forwards;
  max-width: 90vw;
}
@keyframes fade {
  0% { opacity: 0; transform: translateX(-50%) translateY(8px); }
  12% { opacity: 1; transform: translateX(-50%) translateY(0); }
  80% { opacity: 1; }
  100% { opacity: 0; }
}

.hidden { display: none !important; }
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  border: 0;
}

/* ===== Simplified list cards ===== */
.preset-card.simple {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 0;
  padding: 18px 16px 16px;
  cursor: pointer;
}
.preset-card.simple .card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.preset-card.simple .name { font-size: 24px; }
.preset-card.simple .meta { margin-top: 6px; }
.edit-link {
  color: var(--muted);
  font-size: 15px;
  font-weight: 600;
  padding: 8px 4px 8px 12px;

<body>
  <div id="app"></div>
  <div id="prompt-root"></div>
  <input id="sound-upload" class="sr-only" type="file" accept="audio/*">
  <input id="haptic-switch" type="checkbox" switch class="haptic-input" tabindex="-1" aria-hidden="true">
  <label id="haptic-label" class="haptic-label" for="haptic-switch" aria-hidden="true"></label>
  <script>
(function () {
  "use strict";

  const STORAGE_KEY = "round-timer-v1";
  const RING_R = 88;
  const RING_C = 2 * Math.PI * RING_R;

  const SOUND_LIBRARY = [
    { id: "bell", name: "Boxing Bell" },
    { id: "double-bell", name: "Double Bell" },
    { id: "triple-bell", name: "Triple Bell" },
    { id: "short-buzzer", name: "Short Buzzer" },
    { id: "long-buzzer", name: "Long Buzzer" },
    { id: "warning-buzz", name: "Warning Buzz" },
    { id: "tick", name: "Tick / Beep" }
    // User uploads appear separately from this built-in list (id prefix "custom:").
  ];

  const DEFAULT_WARN = {
    ready: { enabled: true, sound: "tick", atSec: 3, mode: "ticks" },
    work: { enabled: true, sound: "warning-buzz", atSec: 10, mode: "once" },
    rest: { enabled: true, sound: "warning-buzz", atSec: 10, mode: "once" }
  };

  const DEFAULT_SOUNDS = {
    workStart: "bell",
    readyStart: "short-buzzer",
    restStart: "double-bell",
    finish: "triple-bell",
    readyWarn: Object.assign({}, DEFAULT_WARN.ready),
    workWarn: Object.assign({}, DEFAULT_WARN.work),
    restWarn: Object.assign({}, DEFAULT_WARN.rest)
  };

  const SOUND_EVENTS = [
    { key: "readyStart", label: "Get Ready start", kind: "cue" },
    { key: "readyWarn", label: "Get Ready countdown", kind: "warn" },
    { key: "workStart", label: "Round start", kind: "cue" },
    { key: "workWarn", label: "Work ending", kind: "warn" },
    { key: "restStart", label: "Rest start", kind: "cue" },
    { key: "restWarn", label: "Rest ending", kind: "warn" },
    { key: "finish", label: "Finished", kind: "cue" }
  ];

  // ---------- helpers ----------
  function uid() {
    return (crypto.randomUUID && crypto.randomUUID()) ||
      ("p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
  }

  function makePreset(partial) {
    partial = partial || {};
    const hasWarmup = Object.prototype.hasOwnProperty.call(partial, "warmupMs") && partial.warmupMs != null;
    const base = {
      id: uid(),
      title: "New Timer",
      rounds: 8,
      workMs: 60000,
      restMs: 30000,
      warmupMs: 10000,
      roundOverrides: [],
      sounds: Object.assign({}, DEFAULT_SOUNDS),
      updatedAt: Date.now()
    };
    const sounds = normalizeSounds(partial.sounds);
    const out = Object.assign(base, partial, { sounds: sounds });
    if (!hasWarmup) out.warmupMs = 10000;
    out.display = normalizeDisplay(partial.display || out.display);
    return out;
  }

  function normalizeDisplay(raw) {
    raw = raw || {};
    return {
      workUseTitle: raw.workUseTitle == null ? true : !!raw.workUseTitle,
      work: raw.work != null ? String(raw.work) : "",
      rest: raw.rest != null ? String(raw.rest) : "REST",
      ready: raw.ready != null ? String(raw.ready) : "GET READY"
    };
  }

  function shortSoundName(id) {
    if (id && id.indexOf("custom:") === 0) return soundName(id);
    const map = {
      bell: "Bell",
      "double-bell": "Double Bell",
      "triple-bell": "Triple Bell",
      "short-buzzer": "Short Buzzer",
      "long-buzzer": "Long Buzzer",
      "warning-buzz": "Warning Buzz",
      tick: "Tick"
    };
    return map[id] || soundName(id);
  }

  function phaseSummary(preset, phase) {
    const field = phase === "work" ? "workMs" : phase === "rest" ? "restMs" : "warmupMs";
    const startKey = phase === "work" ? "workStart" : phase === "rest" ? "restStart" : "readyStart";
    const warnKey = phase === "work" ? "workWarn" : phase === "rest" ? "restWarn" : "readyWarn";
    const ms = preset[field] || 0;
    if (phase === "ready" && ms === 0) return "0:00 · skipped";
    const parts = [formatMs(ms), shortSoundName(preset.sounds[startKey])];
    const w = preset.sounds[warnKey];
    if (w && w.enabled) {
      parts.push((w.mode === "ticks" ? "ticks last " : "warn last ") + w.atSec + "s");
    }
    return parts.join(" · ");
  }

  function displayLabel(run, phase, done) {
    if (done) return "COMPLETE";
    const d = (run && run.display) || normalizeDisplay(null);
    const title = ((run && run.title) || "").trim();
    if (phase === "work") {
      if (d.workUseTitle) {
        const t = title || "WORK";
        return /[!！]$/.test(t) ? t : (t + "!");
      }
      const custom = (d.work || "").trim();
      return custom || "WORK";
    }
    if (phase === "rest") return ((d.rest || "").trim()) || "REST";
    if (phase === "ready") return ((d.ready || "").trim()) || "GET READY";
    return "";
  }

  function fitPhaseLabel(el) {
    if (!el) return;
    el.style.fontSize = "";
    const min = 22;
    let size = 52;
    el.style.fontSize = size + "px";
    const maxH = function () { return size * 2.35; };
    let guard = 0;
    while (guard++ < 40 && size > min && (el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > maxH() + 2)) {
      size -= 1;
      el.style.fontSize = size + "px";
    }
  }

  function cloneWarn(w) {
    return { enabled: !!w.enabled, sound: w.sound, atSec: w.atSec, mode: w.mode === "ticks" ? "ticks" : "once" };
  }

  function normalizeWarn(raw, fallback) {
    const d = cloneWarn(fallback);
    if (!raw || typeof raw !== "object") return d;
    if (typeof raw.enabled === "boolean") d.enabled = raw.enabled;
    if (raw.sound) d.sound = raw.sound;
    if (raw.atSec != null && raw.atSec !== "") {
      const n = Math.round(Number(raw.atSec));
      if (!isNaN(n)) d.atSec = Math.max(1, Math.min(599, n));
    }
    if (raw.mode === "ticks" || raw.mode === "once") d.mode = raw.mode;
    return d;
  }

  function normalizeSounds(raw) {
    raw = raw || {};
    const oldWarning = typeof raw.warning === "string" ? raw.warning : null;
    const workFallback = cloneWarn(DEFAULT_WARN.work);
    const restFallback = cloneWarn(DEFAULT_WARN.rest);
    // Old single "last 10 seconds" warning applied to work (and rest).
    if (oldWarning && raw.workWarn == null) {
      workFallback.sound = oldWarning;
      workFallback.enabled = true;
      workFallback.atSec = 10;
      workFallback.mode = "once";
    }
    if (oldWarning && raw.restWarn == null) {
      restFallback.sound = oldWarning;
      restFallback.enabled = true;
      restFallback.atSec = 10;
      restFallback.mode = "once";
    }
    return {
      workStart: raw.workStart || DEFAULT_SOUNDS.workStart,
      readyStart: raw.readyStart || DEFAULT_SOUNDS.readyStart,
      restStart: raw.restStart || DEFAULT_SOUNDS.restStart,
      finish: raw.finish || DEFAULT_SOUNDS.finish,
      readyWarn: normalizeWarn(raw.readyWarn, DEFAULT_WARN.ready),
      workWarn: normalizeWarn(raw.workWarn, workFallback),
      restWarn: normalizeWarn(raw.restWarn, restFallback)
    };
  }

  function seedPresets() {
    return [
      makePreset({ title: "Boxing", rounds: 12, workMs: 120000, restMs: 30000, warmupMs: 10000 }),
      makePreset({ title: "Minute On/Off", rounds: 10, workMs: 60000, restMs: 60000, warmupMs: 10000 })
    ];
  }

  function loadStore() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { presets: seedPresets(), seeded: true, haptics: true };
      const data = JSON.parse(raw);
      if (!Array.isArray(data.presets)) return { presets: seedPresets(), seeded: true, haptics: data.haptics !== false };
      return {
        presets: data.presets.map(function (p) { return makePreset(p); }),
        seeded: true,
        haptics: data.haptics !== false
      };
    } catch (e) {
      return { presets: seedPresets(), seeded: true, haptics: true };
    }
  }

  function saveStore() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        version: 1,
        seeded: true,
        presets: state.presets,
        haptics: state.haptics !== false
      }));
    } catch (e) {}
  }

  function formatMs(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(total / 60);
    const s = total % 60;
    return m + ":" + String(s).padStart(2, "0");
  }

  function soundName(id) {
    if (id && id.indexOf("custom:") === 0) {
      const c = (state.customSounds || []).find(function (s) { return s.id === id; });
      return c ? c.name : "Custom sound";
    }
    const s = SOUND_LIBRARY.find(function (x) { return x.id === id; });
    return s ? s.name : "None";
  }

  function getRoundTimes(preset, index) {
    const o = (preset.roundOverrides || []).find(function (x) { return x.index === index; });
    return {
      workMs: o && o.workMs != null ? o.workMs : preset.workMs,
      restMs: o && o.restMs != null ? o.restMs : preset.restMs,
      custom: !!o
    };
  }

  function setOverride(preset, index, field, value) {
    const list = (preset.roundOverrides || []).slice();
    let o = list.find(function (x) { return x.index === index; });
    if (!o) {
      o = { index: index };
      list.push(o);
    }
    o[field] = value;
    const def = field === "workMs" ? preset.workMs : preset.restMs;
    const other = field === "workMs" ? o.restMs : o.workMs;
    const otherDef = field === "workMs" ? preset.restMs : preset.workMs;
    if (o.workMs == null || o.workMs === preset.workMs) {
      if (o.restMs == null || o.restMs === preset.restMs) {
        preset.roundOverrides = list.filter(function (x) { return x.index !== index; });
        return;
      }
    }
    // keep even if one field matches default
    if (o.workMs === preset.workMs && (o.restMs == null || o.restMs === preset.restMs)) {
      preset.roundOverrides = list.filter(function (x) { return x.index !== index; });
      return;
    }
    preset.roundOverrides = list;
  }

  function clearOverride(preset, index) {
    preset.roundOverrides = (preset.roundOverrides || []).filter(function (x) { return x.index !== index; });
  }

  function totalDuration(preset) {
    let t = preset.warmupMs || 0;
    for (let i = 0; i < preset.rounds; i++) {
      const r = getRoundTimes(preset, i);
      t += r.workMs;
      if (i < preset.rounds - 1 && r.restMs > 0) t += r.restMs;
    }
    return t;
  }

  function timelineFor(preset) {
    const steps = [];
    if (preset.warmupMs > 0) {
      steps.push({ phase: "ready", round: 1, duration: preset.warmupMs, label: "GET READY" });
    }
    for (let i = 0; i < preset.rounds; i++) {
      const r = getRoundTimes(preset, i);
      steps.push({ phase: "work", round: i + 1, duration: r.workMs, label: "WORK" });
      if (i < preset.rounds - 1 && r.restMs > 0) {
        steps.push({ phase: "rest", round: i + 1, duration: r.restMs, label: "REST" });
      }
    }
    return steps.filter(function (s) { return s.duration > 0; });
  }

  function clampTime(ms, minMs) {
    const max = 99 * 60 * 1000 + 59 * 1000;
    return Math.max(minMs, Math.min(max, ms));
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function vibrate(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
  }

  // ---------- audio (synthesized; upload hook reserved) ----------
  const audio = { ctx: null, silentEl: null, urls: {}, rendering: false, htmlEl: null };

  function setPlaybackSession() {
    try {
      if (navigator.audioSession && navigator.audioSession.type !== "playback") {
        navigator.audioSession.type = "playback";
      }
    } catch (e) {}
  }

  function makeSilentWavUri(seconds) {
    const sr = 8000;
    const n = Math.max(8, Math.floor(sr * (seconds || 0.25)));
    const buf = new ArrayBuffer(44 + n * 2);
    const v = new DataView(buf);
    function wstr(o, s) { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
    wstr(0, "RIFF");
    v.setUint32(4, 36 + n * 2, true);
    wstr(8, "WAVE");
    wstr(12, "fmt ");
    v.setUint32(16, 16, true);
    v.setUint16(20, 1, true);
    v.setUint16(22, 1, true);
    v.setUint32(24, sr, true);
    v.setUint32(28, sr * 2, true);
    v.setUint16(32, 2, true);
    v.setUint16(34, 16, true);
    wstr(36, "data");
    v.setUint32(40, n * 2, true);
    const bytes = new Uint8Array(buf);
    let bin = "";
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return "data:audio/wav;base64," + btoa(bin);
  }

  function encodeWav(audioBuffer) {
    const numCh = audioBuffer.numberOfChannels;
    const sr = audioBuffer.sampleRate;
    const len = audioBuffer.length;
    const buf = new ArrayBuffer(44 + len * numCh * 2);
    const v = new DataView(buf);
    function wstr(o, s) { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
    wstr(0, "RIFF");
    v.setUint32(4, 36 + len * numCh * 2, true);
    wstr(8, "WAVE");
    wstr(12, "fmt ");
    v.setUint32(16, 16, true);
    v.setUint16(20, 1, true);
    v.setUint16(22, numCh, true);
    v.setUint32(24, sr, true);
    v.setUint32(28, sr * numCh * 2, true);
    v.setUint16(32, numCh * 2, true);
    v.setUint16(34, 16, true);
    wstr(36, "data");
    v.setUint32(40, len * numCh * 2, true);
    const chans = [];
    for (let c = 0; c < numCh; c++) chans.push(audioBuffer.getChannelData(c));
    let o = 44;
    for (let i = 0; i < len; i++) {
      for (let c = 0; c < numCh; c++) {
        let s = Math.max(-1, Math.min(1, chans[c][i]));
        v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true);
        o += 2;
      }
    }
    return new Blob([buf], { type: "audio/wav" });
  }

  function startSilentLoop() {
    try {
      if (!audio.silentEl) {
        const el = document.createElement("audio");
        el.setAttribute("playsinline", "true");
        el.setAttribute("webkit-playsinline", "true");
        el.setAttribute("x-webkit-airplay", "deny");
        el.loop = true;
        el.preload = "auto";
        el.volume = 0;
        el.src = makeSilentWavUri(0.25);
        el.style.display = "none";
        document.body.appendChild(el);
        audio.silentEl = el;
      }
      const p = audio.silentEl.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }

  function unlockAudio() {
    setPlaybackSession();
    startSilentLoop();
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        if (!audio.ctx) audio.ctx = new AC();
        if (audio.ctx.state === "suspended") audio.ctx.resume();
      }
    } catch (e) {}
    prerenderSounds();
  }

  function prerenderSounds() {
    if (audio.rendering) return;
    const Offline = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!Offline) return;
    audio.rendering = true;
    const dur = {
      bell: 2.1,
      "double-bell": 2.5,
      "triple-bell": 2.9,
      "short-buzzer": 0.45,
      "long-buzzer": 1.15,
      "warning-buzz": 0.85,
      tick: 0.25
    };
    const ids = SOUND_LIBRARY.map(function (s) { return s.id; });
    function next(i) {
      if (i >= ids.length) return;
      const id = ids[i];
      if (audio.urls[id]) { next(i + 1); return; }
      try {
        const seconds = dur[id] || 2;
        const sr = 44100;
        const ctx = new Offline(1, Math.ceil(sr * seconds), sr);
        renderSynth(id, ctx, 0);
        const done = ctx.startRendering();
        if (done && done.then) {
          done.then(function (buf) {
            audio.urls[id] = URL.createObjectURL(encodeWav(buf));
            next(i + 1);
          }).catch(function () { next(i + 1); });
        } else {
          next(i + 1);
        }
      } catch (e) { next(i + 1); }
    }
    next(0);
  }

  function playHtmlSound(id) {
    const url = audio.urls[id];
    if (!url) return Promise.resolve(false);
    try {
      const el = new Audio(url);
      el.setAttribute("playsinline", "true");
      el.setAttribute("webkit-playsinline", "true");
      el.playsInline = true;
      const p = el.play();
      if (p && p.then) {
        return p.then(function () { return true; }).catch(function () { return false; });
      }
      return Promise.resolve(true);
    } catch (e) {
      return Promise.resolve(false);
    }
  }

  function playBell(ctx, when, gain) {
    gain = gain == null ? 0.85 : gain;
    const freqs = [830, 1245, 1660, 2093, 2489, 3320];
    const decays = [1.7, 1.35, 1.05, 0.85, 0.7, 0.4];
    const gains = [0.5, 0.3, 0.18, 0.14, 0.24, 0.09];
    const master = ctx.createGain();
    master.gain.value = gain;
    const hp = ctx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 350;
    const peak = ctx.createBiquadFilter();
    peak.type = "peaking";
    peak.frequency.value = 2500;
    peak.Q.value = 2;
    peak.gain.value = 6;
    hp.connect(peak);
    peak.connect(master);
    master.connect(ctx.destination);

    freqs.forEach(function (f, i) {
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(f, when);
      osc.frequency.exponentialRampToValueAtTime(f * 0.985, when + 0.35);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(gains[i], when + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, when + decays[i]);
      osc.connect(g);
      g.connect(hp);
      osc.start(when);
      osc.stop(when + decays[i] + 0.05);
    });

    const noiseDur = 0.028;
    const buffer = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * noiseDur)), ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (data.length * 0.35));
    }
    const n = ctx.createBufferSource();
    n.buffer = buffer;
    const ng = ctx.createGain();
    ng.gain.value = 0.32;
    const nf = ctx.createBiquadFilter();
    nf.type = "bandpass";
    nf.frequency.value = 2800;
    nf.Q.value = 1;
    n.connect(nf);
    nf.connect(ng);
    ng.connect(hp);
    n.start(when);
  }

  function playBuzzer(ctx, when, duration, opts) {
    opts = opts || {};
    const freq = opts.freq || 196;
    const gain = opts.gain == null ? 0.22 : opts.gain;
    const master = ctx.createGain();
    master.gain.value = gain;
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = opts.cutoff || 1400;
    const osc = ctx.createOscillator();
    osc.type = "square";
    osc.frequency.setValueAtTime(freq, when);
    if (opts.drop) {
      osc.frequency.exponentialRampToValueAtTime(freq * 0.85, when + duration);
    }
    const osc2 = ctx.createOscillator();
    osc2.type = "sawtooth";
    osc2.frequency.setValueAtTime(freq * 1.49, when);
    const g2 = ctx.createGain();
    g2.gain.value = 0.35;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(1, when + 0.012);
    g.gain.setValueAtTime(1, when + Math.max(0.02, duration - 0.04));
    g.gain.exponentialRampToValueAtTime(0.0001, when + duration);
    osc.connect(g);
    osc2.connect(g2);
    g2.connect(g);
    g.connect(lp);
    lp.connect(master);
    master.connect(ctx.destination);
    osc.start(when);
    osc2.start(when);
    osc.stop(when + duration + 0.02);
    osc2.stop(when + duration + 0.02);
  }

  function playWarningBuzz(ctx, when) {
    for (let i = 0; i < 3; i++) {
      playBuzzer(ctx, when + i * 0.16, 0.09, { freq: 520, cutoff: 2200, gain: 0.18 });
    }
  }

  function playTick(ctx, when) {
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(1240, when);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.3, when + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.09);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start(when);
    osc.stop(when + 0.11);
  }

  function renderSynth(id, ctx, when) {
    switch (id) {
      case "bell":
        playBell(ctx, when);
        break;
      case "double-bell":
        playBell(ctx, when);
        playBell(ctx, when + 0.38);
        break;
      case "triple-bell":
        playBell(ctx, when);
        playBell(ctx, when + 0.36);
        playBell(ctx, when + 0.72);
        break;
      case "short-buzzer":
        playBuzzer(ctx, when, 0.22, { freq: 200 });
        break;
      case "long-buzzer":
        playBuzzer(ctx, when, 0.85, { freq: 180, drop: true });
        break;
      case "warning-buzz":
        playWarningBuzz(ctx, when);
        break;
      case "tick":
        playTick(ctx, when);
        break;
      default:
        break;
    }
  }

  function playSynth(id) {
    if (!audio.ctx) return false;
    try {
      renderSynth(id, audio.ctx, audio.ctx.currentTime + 0.01);
      return true;
    } catch (e) {
      return false;
    }
  }

  function playSound(id) {
    unlockAudio();
    if (!id || id === "none") return;
    function fire(via) {
      logEvent({ type: "play", sound: id, via: via });
    }
    function viaWeb() {
      const ok = playSynth(id);
      if (ok) fire("webaudio");
    }
    const ctx = audio.ctx;
    const start = function () {
      // Prefer a single output: HTML audio when a pre-rendered WAV is ready
      // (more reliable with the iOS silent switch after the playback-category unlock);
      // otherwise Web Audio. Never play both, or sounds would double on desktop.
      // Uploaded sounds are always HTML audio (object URL from IndexedDB).
      playHtmlSound(id).then(function (ok) {
        if (ok) fire("html");
        else if (id.indexOf("custom:") !== 0) viaWeb();
      });
    };
    if (ctx && ctx.state === "suspended") {
      ctx.resume().then(start).catch(start);
    } else {
      start();
    }
  }

  // ---------- state ----------
  const stored = loadStore();
  const state = {
    view: "list",
    presets: stored.presets,
    draft: null,
    draftIsNew: false,
    moreEdit: false,
    moreList: false,
    moreRounds: false,
    run: null,
    overlay: null,
    events: [],
    toast: null,
    wakeLock: null,
    loopInterval: null,
    loopRaf: null,
    haptics: stored.haptics !== false,
    customSounds: [],
    uploadEvent: null,
    prompt: null
  };

  const app = document.getElementById("app");

  // ---------- custom sounds (IndexedDB) + haptics + prompts ----------
  const IDB_NAME = "round-timer-idb";
  const IDB_STORE = "customSounds";
  const CUSTOM_SOUND_MAX = 5 * 1024 * 1024;

  function openSoundDB() {
    return new Promise(function (resolve, reject) {
      if (!window.indexedDB) {
        reject(new Error("no-idb"));
        return;
      }
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function () {
        const db = req.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) {
          db.createObjectStore(IDB_STORE, { keyPath: "id" });
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function idbRequest(fn) {
    return openSoundDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        let req;
        try { req = fn(db); } catch (e) { reject(e); return; }
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }

  function rememberCustomUrl(rec) {
    if (!rec || !rec.id || !rec.blob) return;
    if (audio.urls[rec.id]) {
      try { URL.revokeObjectURL(audio.urls[rec.id]); } catch (e) {}
    }
    audio.urls[rec.id] = URL.createObjectURL(rec.blob);
  }

  function loadCustomSounds() {
    return idbRequest(function (db) {
      return db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).getAll();
    }).then(function (rows) {
      const list = Array.isArray(rows) ? rows : [];
      state.customSounds = list.map(function (r) {
        rememberCustomUrl(r);
        return { id: r.id, name: r.name, mime: r.mime || "", size: r.size || (r.blob && r.blob.size) || 0 };
      });
      return state.customSounds;
    }).catch(function () {
      state.customSounds = state.customSounds || [];
      return state.customSounds;
    });
  }

  const customSoundsReady = loadCustomSounds();

  function nameFromFile(file) {
    let n = (file && file.name) || "Custom sound";
    n = n.replace(/\.[^.]+$/, "").replace(/[_]+/g, " ").trim();
    if (!n) n = "Custom sound";
    if (n.length > 40) n = n.slice(0, 40);
    return n;
  }

  function isAllowedSoundFile(file) {
    const name = (file && file.name) || "";
    const type = (file && file.type) || "";
    if (/\.(mp3|wav|wave|m4a|aac|caf|ogg|flac)$/i.test(name)) return true;
    if (/^audio\//i.test(type)) return true;
    return false;
  }

  function saveCustomSoundRecord(rec) {
    return idbRequest(function (db) {
      return db.transaction(IDB_STORE, "readwrite").objectStore(IDB_STORE).put(rec);
    });
  }

  function deleteCustomSoundRecord(id) {
    return idbRequest(function (db) {
      return db.transaction(IDB_STORE, "readwrite").objectStore(IDB_STORE).delete(id);
    });
  }

  function defaultSoundForKey(key) {
    const ev = SOUND_EVENTS.find(function (x) { return x.key === key; });
    if (!ev) return "bell";
    if (ev.kind === "warn") return (DEFAULT_SOUNDS[key] && DEFAULT_SOUNDS[key].sound) || "warning-buzz";
    return DEFAULT_SOUNDS[key] || "bell";
  }

  function replaceSoundId(sounds, fromId, toId) {
    if (!sounds) return;
    SOUND_EVENTS.forEach(function (ev) {
      if (ev.kind === "warn") {
        if (sounds[ev.key] && sounds[ev.key].sound === fromId) sounds[ev.key].sound = toId;
      } else if (sounds[ev.key] === fromId) {
        sounds[ev.key] = toId;
      }
    });
  }

  function currentSoundForEvent(eventKey) {
    if (!state.draft || !state.draft.sounds) return "";
    const ev = SOUND_EVENTS.find(function (x) { return x.key === eventKey; });
    if (ev && ev.kind === "warn") return state.draft.sounds[eventKey] && state.draft.sounds[eventKey].sound;
    return state.draft.sounds[eventKey];
  }

  function refreshSoundPicks() {
    document.querySelectorAll(".sound-picks[data-event]").forEach(function (el) {
      const key = el.getAttribute("data-event");
      el.outerHTML = soundPickHTML(currentSoundForEvent(key), key);
    });
  }

  function handleSoundUpload(file) {
    if (!file) return;
    if (file.size > CUSTOM_SOUND_MAX) {
      toast("That sound is over 5 MB. Please pick a smaller file (MP3, WAV, M4A, or AAC).");
      return;
    }
    if (!isAllowedSoundFile(file)) {
      toast("Please choose an audio file such as MP3, WAV, M4A, or AAC.");
      return;
    }
    const id = "custom:" + uid();
    const rec = {
      id: id,
      name: nameFromFile(file),
      mime: file.type || "audio/*",
      size: file.size,
      blob: file,
      createdAt: Date.now()
    };
    saveCustomSoundRecord(rec).then(function () {
      rememberCustomUrl(rec);
      state.customSounds.push({ id: rec.id, name: rec.name, mime: rec.mime, size: rec.size });
      const eventKey = state.uploadEvent;
      state.uploadEvent = null;
      if (eventKey && state.overlay && state.overlay.type === "phase" && state.draft) {
        const ev = SOUND_EVENTS.find(function (x) { return x.key === eventKey; });
        if (ev && ev.kind === "warn") state.draft.sounds[eventKey].sound = id;
        else state.draft.sounds[eventKey] = id;
        refreshSoundPicks();
      } else {
        refreshSoundPicks();
      }
      playSound(id);
      toast("Sound added");
    }).catch(function () {
      toast("Couldn’t save that sound on this device.");
    });
  }

  function renameCustomSound(id, name) {
    name = (name || "").trim();
    if (!name) return Promise.resolve();
    if (name.length > 40) name = name.slice(0, 40);
    return openSoundDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        const tx = db.transaction(IDB_STORE, "readwrite");
        const store = tx.objectStore(IDB_STORE);
        const get = store.get(id);
        get.onsuccess = function () {
          const rec = get.result;
          if (!rec) { resolve(); return; }
          rec.name = name;
          store.put(rec);
        };
        get.onerror = function () { reject(get.error); };
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    }).then(function () {
      const row = state.customSounds.find(function (s) { return s.id === id; });
      if (row) row.name = name;
      refreshSoundPicks();
      if (state.view === "edit" && !state.overlay) render();
    });
  }

  function scrubSoundId(sounds, fromId) {
    if (!sounds) return;
    SOUND_EVENTS.forEach(function (ev) {
      const next = defaultSoundForKey(ev.key);
      if (ev.kind === "warn") {
        if (sounds[ev.key] && sounds[ev.key].sound === fromId) sounds[ev.key].sound = next;
      } else if (sounds[ev.key] === fromId) {
        sounds[ev.key] = next;
      }
    });
  }

  function removeCustomSound(id) {
    state.presets.forEach(function (p) { scrubSoundId(p.sounds, id); });
    if (state.draft) scrubSoundId(state.draft.sounds, id);
    if (state.run) scrubSoundId(state.run.sounds, id);
    if (audio.urls[id]) {
      try { URL.revokeObjectURL(audio.urls[id]); } catch (e) {}
      delete audio.urls[id];
    }
    state.customSounds = state.customSounds.filter(function (s) { return s.id !== id; });
    saveStore();
    return deleteCustomSoundRecord(id).then(function () {
      refreshSoundPicks();
    }).catch(function () {
      refreshSoundPicks();
    });
  }

  function closePrompt() {
    state.prompt = null;
    const root = document.getElementById("prompt-root");
    if (root) root.innerHTML = "";
  }

  function showPrompt(opts) {
    state.prompt = opts || {};
    const root = document.getElementById("prompt-root");
    if (!root) return;
    const input = opts.input
      ? '<input id="prompt-input" type="text" maxlength="40" value="' + escapeHtml(opts.value || "") + '">'
      : "";
    const body = opts.body ? "<p>" + escapeHtml(opts.body) + "</p>" : "";
    root.innerHTML =
      '<div class="overlay center" data-action="prompt-backdrop">' +
        '<div class="dialog" role="dialog" aria-modal="true">' +
          "<h3>" + escapeHtml(opts.title || "") + "</h3>" +
          body + input +
          '<div class="row">' +
            '<button type="button" class="ghost-btn" data-action="prompt-cancel">Cancel</button>' +
            '<button type="button" class="' + (opts.danger ? "danger-btn" : "solid-btn") + '" data-action="prompt-ok">' +
              escapeHtml(opts.okLabel || "OK") +
            "</button>" +
          "</div>" +
        "</div>" +
      "</div>";
    const el = document.getElementById("prompt-input");
    if (el) setTimeout(function () { el.focus(); el.select(); }, 50);
  }

  function finishPrompt(ok) {
    const opts = state.prompt;
    const value = (document.getElementById("prompt-input") && document.getElementById("prompt-input").value) || "";
    closePrompt();
    if (ok && opts && opts.onOk) opts.onOk(value);
  }

  function tapHaptic() {
    if (state.haptics === false) return;
    try {
      if (navigator.vibrate) navigator.vibrate(10);
    } catch (e) {}
    try {
      const label = document.getElementById("haptic-label");
      const input = document.getElementById("haptic-switch");
      if (label) label.click();
      else if (input) input.click();
    } catch (e) {}
  }

  // ---------- wake lock ----------
  async function requestWake() {
    try {
      if (navigator.wakeLock) {
        state.wakeLock = await navigator.wakeLock.request("screen");
      }
    } catch (e) {}
  }

  async function releaseWake() {
    try {
      if (state.wakeLock) {
        await state.wakeLock.release();
        state.wakeLock = null;
      }
    } catch (e) {
      state.wakeLock = null;
    }
  }

  // ---------- timer engine ----------
  function findPreset(id) {
    return state.presets.find(function (p) { return p.id === id; });
  }

  function logEvent(ev) {
    if (!state.events) state.events = [];
    state.events.push(Object.assign({ t: Date.now() }, ev));
  }

  function playPhaseCue(step, isFinish) {
    if (isFinish) {
      playSound(state.run.sounds.finish);
      vibrate([200, 80, 200, 80, 400]);
      logEvent({ type: "cue", phase: "done", sound: state.run.sounds.finish });
      return;
    }
    if (!step) return;
    if (step.phase === "ready") {
      playSound(state.run.sounds.readyStart);
      vibrate(80);
      logEvent({ type: "cue", phase: "ready", sound: state.run.sounds.readyStart });
    } else if (step.phase === "work") {
      // Also fires when Get Ready ends, which is when the first work round begins.
      playSound(state.run.sounds.workStart);
      vibrate(200);
      logEvent({ type: "cue", phase: "work", sound: state.run.sounds.workStart });
    } else if (step.phase === "rest") {
      playSound(state.run.sounds.restStart);
      vibrate([120, 60, 120]);
      logEvent({ type: "cue", phase: "rest", sound: state.run.sounds.restStart });
    }
  }

  function warnConfigFor(phase, sounds) {
    if (phase === "ready") return sounds.readyWarn;
    if (phase === "work") return sounds.workWarn;
    if (phase === "rest") return sounds.restWarn;
    return null;
  }

  function clampWarnAtSec(atSec, durationMs) {
    const phaseSec = Math.floor(Math.max(0, durationMs) / 1000);
    const maxAt = phaseSec - 1;
    if (maxAt < 1) return 0;
    return Math.min(Math.max(1, atSec), maxAt);
  }

  function processWarnings(step, rem) {
    const run = state.run;
    const cfg = warnConfigFor(step.phase, run.sounds);
    if (!cfg || !cfg.enabled) return;
    const at = clampWarnAtSec(cfg.atSec, step.duration);
    if (at < 1 || rem <= 0) return;
    const remSec = Math.max(0, Math.ceil(rem / 1000));
    if (cfg.mode === "ticks") {
      if (remSec >= 1 && remSec <= at && run.lastTickSec !== remSec) {
        run.lastTickSec = remSec;
        playSound(cfg.sound);
        vibrate(40);
        logEvent({ type: "warn", phase: step.phase, mode: "ticks", atSec: at, remainingSec: remSec, sound: cfg.sound });
      }
    } else if (rem <= at * 1000 && !run.warned) {
      run.warned = true;
      playSound(cfg.sound);
      vibrate([80, 50, 80]);
      logEvent({ type: "warn", phase: step.phase, mode: "once", atSec: at, remainingSec: remSec, sound: cfg.sound });
    }
  }

  function startRun(preset) {
    unlockAudio();
    requestWake();
    const steps = timelineFor(preset);
    if (!steps.length) {
      toast("This timer has no time in it.");
      return;
    }
    state.run = {
      presetId: preset.id,
      title: preset.title,
      display: normalizeDisplay(preset.display),
      sounds: normalizeSounds(preset.sounds),
      steps: steps,
      index: 0,
      phaseStart: Date.now(),
      paused: false,
      pauseRemaining: null,
      warned: false,
      lastTickSec: null,
      done: false,
      startedAt: Date.now()
    };
    state.events = [];
    state.view = "run";
    render();
    playPhaseCue(steps[0], false);
    startLoop();
  }

  function remainingMs() {
    const run = state.run;
    if (!run || run.done) return 0;
    const step = run.steps[run.index];
    if (!step) return 0;
    if (run.paused) return run.pauseRemaining;
    return Math.max(0, step.duration - (Date.now() - run.phaseStart));
  }

  function goToStep(index, overshoot) {
    const run = state.run;
    if (index >= run.steps.length) {
      run.done = true;
      run.index = run.steps.length;
      run.warned = true;
      run.lastTickSec = null;
      stopLoop();
      releaseWake();
      return "done";
    }
    run.index = index;
    run.phaseStart = Date.now() - (overshoot || 0);
    run.warned = false;
    run.lastTickSec = null;
    run.paused = false;
    run.pauseRemaining = null;
    return "step";
  }

  function catchUp() {
    const run = state.run;
    if (!run || run.paused || run.done) return;
    let skipped = 0;
    let lastKind = "step";
    while (!run.done && skipped < 400) {
      const step = run.steps[run.index];
      if (!step) break;
      const rem = step.duration - (Date.now() - run.phaseStart);
      if (rem > 0) {
        processWarnings(step, rem);
        break;
      }
      lastKind = goToStep(run.index + 1, -rem);
      skipped++;
    }
    if (skipped) {
      if (run.done) playPhaseCue(null, true);
      else playPhaseCue(run.steps[run.index], false);
      renderRunChrome();
    }
    updateRunUI();
  }

  function tick() {
    if (!state.run || state.run.paused || state.run.done) return;
    catchUp();
  }

  function startLoop() {
    stopLoop();
    state.loopInterval = setInterval(tick, 100);
    function raf() {
      tick();
      if (state.run && !state.run.paused && !state.run.done) {
        state.loopRaf = requestAnimationFrame(raf);
      }
    }
    state.loopRaf = requestAnimationFrame(raf);
  }

  function stopLoop() {
    if (state.loopInterval) {
      clearInterval(state.loopInterval);
      state.loopInterval = null;
    }
    if (state.loopRaf) {
      cancelAnimationFrame(state.loopRaf);
      state.loopRaf = null;
    }
  }

  function pauseRun() {
    const run = state.run;
    if (!run || run.done || run.paused) return;
    run.pauseRemaining = remainingMs();
    run.paused = true;
    stopLoop();
    releaseWake();
    renderRunChrome();
    updateRunUI();
  }

  function resumeRun() {
    const run = state.run;
    if (!run || run.done || !run.paused) return;
    const step = run.steps[run.index];
    run.phaseStart = Date.now() - (step.duration - run.pauseRemaining);
    run.paused = false;
    run.pauseRemaining = null;
    unlockAudio();
    requestWake();
    startLoop();
    renderRunChrome();
    updateRunUI();
  }

  function stopRun() {
    stopLoop();
    releaseWake();
    state.run = null;
    state.view = "list";
    render();
  }

  function restartRun() {
    const id = state.run && state.run.presetId;
    const preset = id && findPreset(id);
    stopLoop();
    releaseWake();
    if (preset) startRun(preset);
    else stopRun();
  }

  // ---------- overlays ----------
  function closeOverlay() {
    const wasPhase = state.overlay && state.overlay.type === "phase";
    if (wasPhase) syncPhasePanel();
    state.overlay = null;
    renderOverlay();
    if (wasPhase && state.view === "edit" && state.draft) render();
  }

  function toast(msg) {
    state.toast = msg;
    renderToast();
    setTimeout(function () {
      if (state.toast === msg) {
        state.toast = null;
        renderToast();
      }
    }, 2200);
  }

  function renderToast() {
    let el = document.getElementById("toast");
    if (!state.toast) {
      if (el) el.remove();
      return;
    }

  function phaseField(phase) {
    return phase === "work" ? "workMs" : phase === "rest" ? "restMs" : "warmupMs";
  }

  function phaseStartKey(phase) {
    return phase === "work" ? "workStart" : phase === "rest" ? "restStart" : "readyStart";
  }

  function phaseWarnKey(phase) {
    return phase === "work" ? "workWarn" : phase === "rest" ? "restWarn" : "readyWarn";
  }

  function phaseTitle(phase) {
    return phase === "work" ? "Work" : phase === "rest" ? "Rest" : "Get Ready";
  }

  function syncPhasePanel() {
    if (!state.overlay || state.overlay.type !== "phase" || !state.draft) return;
    const phase = state.overlay.phase;
    if (!state.draft.display) state.draft.display = normalizeDisplay(null);
    const workInp = document.getElementById("phase-display-work");
    const restInp = document.getElementById("phase-display-rest");
    const readyInp = document.getElementById("phase-display-ready");
    if (workInp) state.draft.display.work = workInp.value;
    if (restInp) state.draft.display.rest = restInp.value;
    if (readyInp) state.draft.display.ready = readyInp.value;
    const customSec = document.getElementById("warn-custom-sec");
    if (customSec && String(customSec.value).trim() !== "") {
      const n = Math.max(1, Math.min(599, Math.round(Number(customSec.value) || 1)));
      const warnKey = phaseWarnKey(phase);
      if (state.draft.sounds[warnKey]) state.draft.sounds[warnKey].atSec = n;
    }
    const minEl = document.getElementById("phase-min");
    const secEl = document.getElementById("phase-sec");
    if (minEl && secEl) {
      const m = Math.max(0, Math.min(99, parseInt(minEl.value, 10) || 0));
      const s = Math.max(0, Math.min(59, parseInt(secEl.value, 10) || 0));
      const field = phaseField(phase);
      const minMs = field === "workMs" ? 1000 : 0;
      state.draft[field] = clampTime((m * 60 + s) * 1000, minMs);
    }
  }

  function bindSheetDismiss(root) {
    const overlay = root.querySelector(".overlay:not(.center)");
    if (!overlay) return;
    const sheet = overlay.querySelector(".sheet");
    if (!sheet) return;
    const scroll = sheet.querySelector(".sheet-scroll") || sheet;
    const grab = sheet.querySelector(".grab");
    let drag = null;

    function onDown(e) {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      if (e.target && e.target.closest && e.target.closest("input, textarea, select")) return;
      const onGrab = !!(grab && (e.target === grab || grab.contains(e.target)));
      const atTop = !scroll || scroll.scrollTop <= 1;
      drag = {
        id: e.pointerId,
        startY: e.clientY,
        startX: e.clientX,
        lastY: e.clientY,
        lastT: Date.now(),
        vy: 0,
        y: 0,
        dragging: onGrab,
        canStart: onGrab || atTop,
        onGrab: onGrab
      };
      if (onGrab) {
        sheet.classList.add("dragging");
        sheet.style.transition = "none";
        try { sheet.setPointerCapture(e.pointerId); } catch (err) {}
      }
    }

    function onMove(e) {
      if (!drag || e.pointerId !== drag.id) return;
      const now = Date.now();
      const dy = e.clientY - drag.startY;
      const dx = e.clientX - drag.startX;
      const dt = Math.max(1, now - drag.lastT);
      drag.vy = (e.clientY - drag.lastY) / dt;
      drag.lastY = e.clientY;
      drag.lastT = now;

      if (!drag.dragging) {
        if (!drag.canStart) return;
        if (dy < -10) { drag.canStart = false; return; }
        if (dy > 10 && Math.abs(dy) > Math.abs(dx) * 1.15) {
          if (!drag.onGrab && scroll && scroll.scrollTop > 1) { drag.canStart = false; return; }
          drag.dragging = true;
          sheet.classList.add("dragging");
          sheet.style.transition = "none";
          try { sheet.setPointerCapture(e.pointerId); } catch (err) {}
        } else {
          return;
        }
      }

      if (e.cancelable) e.preventDefault();
      const y = Math.max(0, dy);
      drag.y = y;
      sheet.style.transform = "translateY(" + y + "px)";
    }

    function finish(e) {
      if (!drag || (e && e.pointerId !== drag.id)) return;
      const d = drag;
      drag = null;
      sheet.classList.remove("dragging");
      if (!d.dragging) return;
      if (d.y > 6) {
        const swallow = function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
          sheet.removeEventListener("click", swallow, true);
        };
        sheet.addEventListener("click", swallow, true);
        setTimeout(function () { sheet.removeEventListener("click", swallow, true); }, 400);
      }
      const tall = sheet.getBoundingClientRect().height || 480;
      const close = d.y > 120 || d.y > tall * 0.22 || (d.vy > 0.65 && d.y > 28);
      if (close) {
        sheet.style.transition = "transform 0.2s ease";
        sheet.style.transform = "translateY(110%)";
        setTimeout(function () { closeOverlay(); }, 200);
      } else {
        sheet.style.transition = "transform 0.25s ease";
        sheet.style.transform = "translateY(0)";
      }
    }

    sheet.addEventListener("pointerdown", onDown);
    sheet.addEventListener("pointermove", onMove, { passive: false });
    sheet.addEventListener("pointerup", finish);
    sheet.addEventListener("pointercancel", finish);
  }

  function renderOverlay() {
    let root = document.getElementById("overlay-root");

      }).join("");
      root.innerHTML =

            '<div class="mode-row">' +
              '<button type="button" class="chip' + (cfg.mode === "once" ? " on" : "") + '" data-action="warn-mode" data-mode="once">Once</button>' +
              '<button type="button" class="chip' + (cfg.mode === "ticks" ? " on" : "") + '" data-action="warn-mode" data-mode="ticks">Every second</button>' +
            "</div>" +

      bindSheetDismiss(root);

    if (o.type === "time") {
